<style>
  /* ==========================================================
     VARIABILI GLOBALI E THEME
     ========================================================== */
  :root {
    --bg: #faf6ee;
    --bg2: #f1e9db;
    --card: #fffdf8;
    --ink: #3a2f28;
    --muted: #7d7166;
    --line: #e2d7c5;
    --accent: #7f8a72;
    --hl: #fff4dc;
    --shape: #f4eadb;
    --shape2: #d4c2a2;
    --shadow: rgba(90, 70, 45, 0.16);
    --flame: #eab866;

    --t1a: #f3e9d7;
    --t1b: #dcc6a3;
    --t2a: #f5eee3;
    --t2b: #e3d4bc;
    --t3a: #ece0cf;
    --t3b: #cfb994;
    --t4a: #f1e7de;
    --t4b: #dcc4b1;
    --t5a: #eee7da;
    --t5b: #cdbfa5;

    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --sans: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* Tema scuro: si attiva solo dal toggle dell'header. */
  :root[data-theme='dark'] {
    color-scheme: dark;
    --bg: #1e1a16;
    --bg2: #27221c;
    --card: #2b251f;
    --ink: #f0e8dc;
    --muted: #ab9f90;
    --line: #3c342b;
    --accent: #a3ae94;
    --hl: #3d3225;
    --shape: #3a3229;
    --shape2: #65553f;
    --shadow: rgba(0, 0, 0, 0.4);
    --flame: #f2c877;

    --t1a: #302820;
    --t1b: #4a3c2c;
    --t2a: #2d2620;
    --t2b: #43372b;
    --t3a: #332a21;
    --t3b: #524231;
    --t4a: #2f2721;
    --t4b: #4a3a30;
    --t5a: #2e2820;
    --t5b: #48402f;
  }

  /* ==========================================================
     BASE LAYOUT E TYPOGRAPHY
     ========================================================== */
  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
    -webkit-text-size-adjust: 100%;
  }

  *, *::before, *::after {
    box-sizing: inherit;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 17px/1.65 var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body.menu-open {
    overflow: hidden;
  }

  img {
    max-width: 100%;
  }

  a {
    color: inherit;
  }

  h1, h2, h3 {
    font-family: var(--serif);
    font-weight: 300;
    margin: 0;
    letter-spacing: -0.005em;
  }

  h2 {
    font-size: clamp(32px, 5.2vw, 54px);
    line-height: 1.1;
  }

  h3 {
    font-size: 22px;
    line-height: 1.25;
    font-weight: 400;
  }

  p {
    margin: 0 0 1em;
    max-width: 62ch;
  }

  .lead {
    font: italic 300 clamp(20px, 2.4vw, 26px) / 1.45 var(--serif);
    color: var(--ink);
    max-width: 36em;
  }

  .muted {
    color: var(--muted);
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 22px;
  }

  .narrow {
    max-width: 760px;
  }

  .center {
    text-align: center;
  }

  .center p,
  .center .lead {
    margin-left: auto;
    margin-right: auto;
  }

  .sec {
    padding: clamp(56px, 9vw, 112px) 0;
  }

  .alt {
    background: var(--bg2);
  }

  .stack > * + * {
    margin-top: 22px;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 28px;
  }

  .center .actions {
    justify-content: center;
  }

  /* ==========================================================
     HEADER E NAVIGAZIONE
     ========================================================== */
  .hdr {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 50;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }

  .hdr .in {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 62px;
  }

  .logo {
    font: 300 28px/1 var(--serif);
    letter-spacing: 0.14em;
    text-decoration: none;
    color: var(--ink);
  }

  .nav {
    display: none;
    gap: 30px;
  }

  .nav a,
  .mnav a {
    text-decoration: none;
  }

  .nav a {
    font-size: 15px;
    color: var(--muted);
    padding: 6px 0;
    border-bottom: 1px solid transparent;
  }

  .nav a:hover {
    color: var(--ink);
  }

  .nav a.on {
    color: var(--ink);
    border-color: var(--ink);
  }

  .tools {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .theme {
    width: 44px;
    height: 44px;
    border: 0;
    background: none;
    cursor: pointer;
    color: var(--ink);
    display: grid;
    place-items: center;
  }

  .theme svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .theme .sun {
    display: none;
  }

  :root[data-theme='dark'] .theme .sun {
    display: block;
  }

  :root[data-theme='dark'] .theme .moon {
    display: none;
  }

  .burger {
    width: 44px;
    height: 44px;
    border: 0;
    background: none;
    cursor: pointer;
    position: relative;
    color: var(--ink);
  }

  .burger span {
    position: absolute;
    left: 11px;
    right: 11px;
    height: 1.5px;
    background: currentColor;
    transition: transform 0.3s, top 0.3s;
  }

  .burger span:nth-child(1) {
    top: 18px;
  }

  .burger span:nth-child(2) {
    top: 26px;
  }

  body.menu-open .burger span:nth-child(1) {
    top: 22px;
    transform: rotate(45deg);
  }

  body.menu-open .burger span:nth-child(2) {
    top: 22px;
    transform: rotate(-45deg);
  }

  .mnav {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 18px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }

  body.menu-open .mnav {
    opacity: 1;
    pointer-events: auto;
  }

  .mnav a {
    font: 300 36px/1.2 var(--serif);
    padding: 4px 12px;
  }

  .mnav a.on {
    font-style: italic;
  }

  @media (min-width: 900px) {
    .nav {
      display: flex;
    }

    .burger {
      display: none;
    }

    .mnav {
      display: none;
    }
  }

  /* ==========================================================
     BOTTONI, CHIP E FOCUS
     ========================================================== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 50px;
    padding: 0 28px;
    font: 500 15px/1 var(--sans);
    text-decoration: none;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--ink);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }

  .btn:hover {
    background: var(--ink);
    color: var(--bg);
  }

  .btn.solid {
    background: var(--ink);
    color: var(--bg);
  }

  .btn.solid:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn.block {
    width: 100%;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    min-height: 42px;
    padding: 0 18px;
    font: 400 15px/1 var(--sans);
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }

  .chip:hover {
    border-color: var(--ink);
  }

  .chip.on {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .chip:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* ==========================================================
     MEDIA E ILLUSTRAZIONI
     ========================================================== */
  .media {
    position: relative;
    overflow: hidden;
    background: linear-gradient(165deg, var(--pa), var(--pb));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .christmas-photo img {
    filter: blur(18px);
    transform: scale(1.08);
  }

  .product-photo {
    position: relative;
  }

  .photo-countdown {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 8px;
    padding: 18px;
    text-align: center;
    background: rgba(58, 47, 40, 0.2);
    color: #fff;
  }

  .photo-countdown b {
    font: 400 24px/1.1 var(--serif);
  }

  .photo-countdown span {
    font-size: 14px;
  }

  .media svg {
    width: 54%;
    max-width: 250px;
    height: auto;
    display: block;
  }

  .media .ph {
    position: absolute;
    left: 14px;
    bottom: 12px;
    font-size: 12px;
    color: var(--ink);
    opacity: 0.45;
  }

  .tone1 { --pa: var(--t1a); --pb: var(--t1b); }
  .tone2 { --pa: var(--t2a); --pb: var(--t2b); }
  .tone3 { --pa: var(--t3a); --pb: var(--t3b); }
  .tone4 { --pa: var(--t4a); --pb: var(--t4b); }
  .tone5 { --pa: var(--t5a); --pb: var(--t5b); }

  .arch {
    border-radius: 999px 999px 0 0;
    aspect-ratio: 3 / 4;
  }

  .arch svg {
    width: 66%;
    margin-top: 14%;
  }

  /* ==========================================================
     HERO
     ========================================================== */
  .hero {
    position: relative;
    overflow: hidden;
    isolation: isolate;
    background: var(--hero-image, linear-gradient(180deg, var(--t2a), var(--t1b))) center / cover no-repeat;
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(90deg, color-mix(in srgb, var(--bg) 86%, transparent), color-mix(in srgb, var(--bg) 34%, transparent) 58%, transparent);
  }

  .hero .in {
    display: grid;
    gap: 30px;
    padding: 34px 22px 60px;
    align-items: center;
  }

  .logo-xl {
    font: 300 clamp(64px, 15vw, 132px) / 0.95 var(--serif);
    letter-spacing: 0.05em;
  }

  .tagline {
    font: italic 300 clamp(21px, 3vw, 30px) / 1.35 var(--serif);
    margin: 18px 0 0;
    max-width: 20em;
  }

  .hero-text {
    text-align: center;
  }

  .hero-text .tagline {
    margin-left: auto;
    margin-right: auto;
  }

  .hero .actions {
    justify-content: center;
  }

  @media (min-width: 900px) {
    .hero .in {
      grid-template-columns: 1.1fr 0.9fr;
      padding: 64px 22px 84px;
      min-height: min(80svh, 760px);
    }

    .hero-text {
      text-align: left;
    }

    .hero-text .tagline {
      margin-left: 0;
    }

    .hero .actions {
      justify-content: flex-start;
    }
  }

  /* Animazioni leggere dell'hero */
  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }

  @keyframes flick {
    0%, 100% { transform: scale(1) rotate(0); }
    30% { transform: scale(0.96, 1.05) rotate(-1.5deg); }
    60% { transform: scale(1.03, 0.97) rotate(1deg); }
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; }
  }

  .hero-text > * {
    animation: rise 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }

  .hero-text > *:nth-child(2) { animation-delay: 0.25s; }
  .hero-text > *:nth-child(3) { animation-delay: 0.5s; }

  .hero .flame {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: flick 3.4s ease-in-out infinite;
  }

  .hero .glow {
    animation: breathe 4s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .hero-text > *,
    .hero .flame,
    .hero .glow {
      animation: none;
    }
  }

  /* ==========================================================
     LAYOUT GENERICO (SEZIONI, GRIGLIE, CARD)
     ========================================================== */
  .split {
    display: grid;
    gap: 36px;
    align-items: center;
  }

  @media (min-width: 900px) {
    .split {
      grid-template-columns: 1fr 1fr;
      gap: 88px;
    }

    .split.rev > .media,
    .split.rev > .arch {
      order: 2;
    }
  }

  .tiles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 26px 14px;
    margin-top: 44px;
  }

  @media (min-width: 900px) {
    .tiles {
      grid-template-columns: repeat(4, 1fr);
      gap: 26px 22px;
    }
  }

  .tile {
    display: block;
    text-decoration: none;
  }

  .tile .arch svg {
    width: 60%;
  }

  .tile h3 {
    margin: 14px 0 2px;
  }

  .tile p {
    font-size: 15px;
    color: var(--muted);
    margin: 0;
  }

  .tile:hover h3 {
    text-decoration: underline;
    text-underline-offset: 5px;
    text-decoration-thickness: 1px;
  }

  .pgrid-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 34px 14px;
  }

  @media (min-width: 900px) {
    .pgrid-list {
      grid-template-columns: repeat(3, 1fr);
      gap: 48px 26px;
    }
  }

  .pcard {
    display: block;
    text-decoration: none;
  }

  .pcard h3 {
    font-size: 20px;
    margin: 14px 0 2px;
  }

  .pcard .m {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.45;
  }

  .pcard .pr {
    margin-top: 6px;
    font-size: 15px;
  }

  .pcard .sub {
    margin-top: 8px;
    color: var(--ink);
    font-size: 15px;
    line-height: 1.4;
  }

  .pcard:hover h3 {
    text-decoration: underline;
    text-underline-offset: 5px;
    text-decoration-thickness: 1px;
  }

  .pagehead {
    padding: clamp(48px, 8vw, 96px) 0 clamp(28px, 5vw, 56px);
  }

  .pagehead h1 {
    font-size: clamp(44px, 8vw, 88px);
    line-height: 1;
  }

  .pagehead .lead {
    margin-top: 22px;
  }

  .steps {
    display: grid;
    gap: 30px;
    margin-top: 44px;
    counter-reset: s;
  }

  @media (min-width: 760px) {
    .steps {
      grid-template-columns: repeat(var(--n, 3), 1fr);
      gap: 36px;
    }
  }

  .step {
    border-top: 1px solid var(--ink);
    padding-top: 16px;
  }

  .step b {
    display: block;
    font: italic 300 30px/1 var(--serif);
    margin-bottom: 10px;
  }

  .step h3 {
    font-size: 21px;
    margin-bottom: 6px;
  }

  .step p {
    margin: 0;
    color: var(--muted);
    font-size: 16px;
  }

  .vs {
    display: grid;
    gap: 14px;
    margin-top: 36px;
  }

  @media (min-width: 760px) {
    .vs {
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }
  }

  .vs > div {
    padding: 26px;
    background: var(--card);
    border: 1px solid var(--line);
  }

  .vs h3 {
    margin-bottom: 10px;
  }

  .vs ul {
    margin: 0;
    padding-left: 1.1em;
    color: var(--muted);
  }

  .vs li + li {
    margin-top: 6px;
  }

  .quote {
    font: italic 300 clamp(28px, 4.4vw, 46px) / 1.28 var(--serif);
    max-width: 20em;
    margin: 0 auto;
  }

  details {
    border-top: 1px solid var(--line);
  }

  details:last-of-type {
    border-bottom: 1px solid var(--line);
  }

  summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 20px 0;
    font: 400 22px/1.3 var(--serif);
  }

  summary::-webkit-details-marker {
    display: none;
  }

  summary::after {
    content: '+';
    font: 300 26px/1 var(--sans);
    color: var(--muted);
  }

  details[open] summary::after {
    content: '–';
  }

  details p {
    color: var(--muted);
    margin: 0 0 22px;
  }

  .frlist {
    display: grid;
    gap: 0;
    margin-top: 34px;
  }

  @media (min-width: 900px) {
    .frlist {
      grid-template-columns: 1fr 1fr;
      column-gap: 64px;
    }
  }

  .fr {
    padding: 22px 0;
    border-top: 1px solid var(--line);
  }

  .fr h3 {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }

  .fr h3 small {
    font: 400 14px var(--sans);
    color: var(--muted);
  }

  .fr p {
    margin: 8px 0 8px;
    color: var(--muted);
    font-size: 16px;
  }

  .notes {
    font-size: 14px;
    color: var(--ink);
  }

  .notes i {
    font-style: normal;
    color: var(--muted);
  }

  #famout {
    margin-top: 24px;
    min-height: 120px;
  }

  #famout .mood {
    font: italic 300 22px/1.4 var(--serif);
    margin-bottom: 6px;
  }

  /* ==========================================================
     PRODOTTO E DETTAGLIO
     ========================================================== */
  .crumb {
    font-size: 15px;
    color: var(--muted);
    text-decoration: none;
    display: inline-block;
    padding: 22px 0 14px;
  }

  .crumb:hover {
    color: var(--ink);
  }

  .pdp {
    display: grid;
    gap: 30px;
    padding-bottom: 70px;
  }

  @media (min-width: 900px) {
    .pdp {
      grid-template-columns: 1.15fr 1fr;
      gap: 72px;
      align-items: start;
    }

    .pinfo {
      position: sticky;
      top: 96px;
    }
  }

  .gal {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .gal::-webkit-scrollbar {
    display: none;
  }

  .gal .media {
    flex: 0 0 88%;
    scroll-snap-align: center;
    aspect-ratio: 4 / 5;
  }

  @media (min-width: 900px) {
    .gal {
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: visible;
    }

    .gal .media {
      flex: none;
    }

    .gal .media:first-child {
      grid-column: 1 / -1;
      aspect-ratio: 1;
    }
  }

  .pinfo h1 {
    font-size: clamp(36px, 5vw, 54px);
    line-height: 1.05;
    margin: 4px 0 12px;
  }

  .pinfo .cat {
    font-size: 15px;
    color: var(--muted);
  }

  .pinfo .price {
    font: 400 24px var(--serif);
    margin-bottom: 18px;
  }

  .opt {
    margin-top: 24px;
  }

  .opt > b {
    display: block;
    font: 500 15px var(--sans);
    margin-bottom: 10px;
  }

  .frdesc {
    margin: 14px 0 0;
    font: italic 300 19px/1.45 var(--serif);
  }

  .frdesc small {
    display: block;
    font: 400 14px var(--sans);
    font-style: normal;
    color: var(--muted);
    margin-top: 4px;
  }

  dl.spec {
    margin: 28px 0 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 10px 22px;

let sel = {v:0, f:null, frags:[], mix:null, q:1};
function quantityConfig(p) {
  if (p?.quantity) return p.quantity;
  return p?.cat === 'candele' ? {min: 1, max: 5} : null;
}
function fragList(p) {
  if (p.cat !== 'wax') return [];
  return p.fragrances === 'all' ? FRAGRANCES : FRAGRANCES.filter(f => (p.fragrances || []).includes(f.id));
}
function selectedQuantity(p) {
  const config = quantityConfig(p);
  if (!config) return null;
  return Math.max(config.min, Math.min(config.max, Number(sel.q) || config.min));
}
function mixDistributionItems(p, quantity, mix, selectedFragrances) {
  if (!p.quantity || !mix) return '';
  if (selectedFragrances.length < mix) {
    const remaining = mix - selectedFragrances.length;
    return `Nota: seleziona ancora ${remaining} ${remaining === 1 ? 'fragranza' : 'fragranze'} per completare il mix.`;
  }
  const base = Math.floor(quantity / mix);
  const remainder = quantity % mix;
  const details = selectedFragrances.map((fragrance, index) => `${base + (index < remainder ? 1 : 0)} ${fragrance.name}`);
  return details;
}
function mixDistribution(p, quantity, mix, selectedFragrances) {
  const items = mixDistributionItems(p, quantity, mix, selectedFragrances);
  return Array.isArray(items) ? items.join('\n') : items;
}
function mixDistributionHtml(p, quantity, mix, selectedFragrances) {
  const items = mixDistributionItems(p, quantity, mix, selectedFragrances);
  if (!items) return '';
  if (!Array.isArray(items)) return `<span>${items}</span>`;
  return `<ul class="mix-list">${items.map(item => `<li>${item}</li>`).join('')}</ul>`;
}
function orderMessage(p) {
  const v = p.variants[sel.v];
  const frs = fragList(p);
  const fr = frs.find(f => f.id === sel.f) || null;
  const quantity = selectedQuantity(p);
  const mix = p.mixOptions?.includes(sel.mix) && (!quantity || sel.mix <= quantity) ? sel.mix : null;
  const selectedFragrances = frs.filter(f => sel.frags.includes(f.id));
  const selection = quantity ? `${quantity} ${quantity === 1 ? 'pezzo' : 'pezzi'}` : (p.variants.length > 1 ? v.label : '');
  const fragrance = mix
    ? `, mix di ${mix} fragranze${selectedFragrances.length ? `: ${selectedFragrances.map(f => f.name).join(', ')}` : ''}`
    : (fr ? `, fragranza ${fr.name}` : '');
  const distribution = mixDistribution(p, quantity, mix, selectedFragrances);
  return p.quote
    ? `Ciao! Vorrei un preventivo per: ${p.name}${fragrance}. Occasione e quantità: `
    : `Ciao! Vorrei ordinare: ${p.name}${selection ? ` (${selection})` : ''}${fragrance}${distribution ? `. ${distribution}` : ''}.`;
}
function Buy(p) {
  const v = p.variants[sel.v];
  const quantityConfigForProduct = quantityConfig(p);
  const frs = fragList(p);
  const fr = frs.find(f => f.id === sel.f) || null;
  const quantity = selectedQuantity(p);
  const mix = p.mixOptions?.includes(sel.mix) && (!quantity || sel.mix <= quantity) ? sel.mix : null;
  const selectedFragrances = frs.filter(f => sel.frags.includes(f.id));
  const distribution = mixDistribution(p, quantity, mix, selectedFragrances);
  const distributionHtml = mixDistributionHtml(p, quantity, mix, selectedFragrances);
  const currentPrice = quantity ? (p.quantity?.unitPrice || v.price) * quantity : v.price;
  const msg = orderMessage(p);
  const quote = !!p.quote;
  const info = `Ciao! Vorrei qualche informazione su: ${p.name}.`;
  return `
<span class="cat">${CATS[p.cat]}</span>
<h1>${p.name}</h1>
<div class="price">${currentPrice != null ? eur(currentPrice) : 'Preventivo su richiesta'}</div>
${p.variants.length > 1 ? `<div class="opt"><b>Formato</b><div class="chips">${p.variants.map((x,i) => `<button class="chip ${i===sel.v?'on':''}" data-var="${i}">${x.label}</button>`).join('')}</div></div>` : ''}
${quantityConfigForProduct ? `<div class="opt"><b>Quantità</b><input type="number" min="${quantityConfigForProduct.min}" max="${quantityConfigForProduct.max}" step="1" value="${quantity}" data-qty aria-label="Quantità di pezzi"><small class="qty-price" data-qty-price>Prezzo: ${eur(currentPrice)}</small></div>` : ''}
${p.mixOptions?.length ? `<div class="opt"><b>Mix di fragranze</b><div class="chips">${p.mixOptions.map(n => `<button class="chip ${n===mix?'on':''}" data-mix="${n}" ${quantity && n > quantity ? 'disabled' : ''}>Mix di ${n}</button>`).join('')}</div></div>` : ''}
${frs.length ? `<div class="opt"><b>${mix ? `Scegli ${mix} fragranze` : 'Fragranza'}</b><div class="chips">${frs.map(f => `<button class="chip ${(mix ? selectedFragrances.some(selected => selected.id === f.id) : f.id===sel.f)?'on':''}" data-fr="${f.id}">${f.name}</button>`).join('')}</div>
  ${fr ? `<p class="frdesc">${fr.desc}<small>Note:<br>${fr.notes.join('<br>')}</small></p>` : ''}</div>` : ''}
<dl class="spec">
  ${p.variants.length > 1 ? `<dt>Formato</dt><dd>${v.label}</dd>` : ''}
  <dt>Dimensioni</dt><dd>${v.dimensions || 'Da definire'}</dd>
  ${mix && distributionHtml ? `<dt>Distribuzione</dt><dd data-mix-distribution>${distributionHtml}</dd>` : ''}
  ${p.custom ? `<dt>Personalizzazione</dt><dd>${p.custom}</dd>` : ''}
</dl>
<div class="buyrow">
  ${externalWA(msg, quote ? 'Richiedi un preventivo' : 'Ordina su WhatsApp', 'btn solid block js-order-wa')}
  <a class="btn block" href="#/contatti">Chiedi informazioni</a>
</div>`;
}

}

const TITLES = {
  home: 'Essenza — Candele, wax melts e bomboniere',
  shop: 'Collezioni — Essenza',
  wax: 'Wax melts — Essenza',
  bomb: 'Bomboniere — Essenza',
  about: 'La storia di Essenza',
  contatti: 'Contatti — Essenza'
};

function router() {
  const [a, b] = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  let html, key = 'home';

  switch (a) {
    case 'shop':
      html = Shop(b);
      key = 'shop';
      break;
    case 'prodotto':
      html = Product(b);
      key = 'shop';
      break;
    case 'wax-melts':
      html = Wax();
      key = 'wax';
      break;
    case 'bomboniere':
      html = Bomb();
      key = 'bomb';
      break;
    case 'essenza':
      html = About();
      key = 'about';
      break;
    case 'contatti':
      html = Contact();
      key = 'contatti';
      break;
    default:
      html = Home();
  }

  $('#app').innerHTML = html;
  document.title = a === 'prodotto' && P[b] ? `${P[b].name} — Essenza` : TITLES[key];

  document.querySelectorAll('[data-nav]').forEach(el => {
    const on = el.dataset.nav === key;
    el.classList.toggle('on', on);
    on ? el.setAttribute('aria-current', 'page') : el.removeAttribute('aria-current');
  });

  setMenu(false);
  if ($('#famout')) famShow('mattina');
  window.scrollTo(0, 0);
}

function setMenu(open) {
  document.body.classList.toggle('menu-open', open);
  $('#burger').setAttribute('aria-expanded', open);
  $('#burger').setAttribute('aria-label', open ? 'Chiudi il menu' : 'Apri il menu');
}

function famShow(id) {
  const f = FAMILIES.find(x => x.id === id);
  if (!f || !$('#famout')) return;

  $('#famout').innerHTML = `
    <p class="mood">${f.mood}</p>`;
}

function updateCountdowns() {
  document.querySelectorAll('[data-countdown]').forEach(countdown => {
    const target = new Date(countdown.dataset.countdown).getTime();
    const remaining = target - Date.now();
    const output = countdown.querySelector('span');
    if (remaining <= 0) {
      countdown.querySelector('b').textContent = 'Disponibile ora';
      output.textContent = '';
      countdown.closest('.product-photo')?.querySelector('.christmas-photo')?.classList.remove('christmas-photo');
      return;
    }

    const days = Math.floor(remaining / 86400000);
    const hours = Math.floor((remaining % 86400000) / 3600000);
    const minutes = Math.floor((remaining % 3600000) / 60000);
    const seconds = Math.floor((remaining % 60000) / 1000);
    output.textContent = `${days}g ${hours}h ${minutes}m ${seconds}s`;
  });
}

/* =====================================================================
   TEMA E INTERAZIONI
   ===================================================================== */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('img[data-candle-theme="true"]').forEach(img => {
    const isDark = t === 'dark';
    const lightSrc = img.dataset.lightSrc || img.src;
    const darkSrc = img.dataset.darkSrc || getDarkCandleSrc(lightSrc);
    const nextSrc = isDark ? darkSrc : lightSrc;

    img.onerror = () => {
      if (img.dataset.lightSrc && img.src !== img.dataset.lightSrc) {
        img.src = img.dataset.lightSrc;
      }
      img.onerror = null;
    };

    if (nextSrc) img.src = nextSrc;
  });
  const b = $('#theme');
  b.setAttribute('aria-pressed', t === 'dark');
  b.setAttribute('aria-label', t === 'dark' ? 'Passa al tema chiaro' : 'Passa al tema scuro');
}

function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try {
    localStorage.setItem('essenza-theme', next);
  } catch (_) {}
}

document.addEventListener('click', e => {
  if (e.target.closest('#theme')) return toggleTheme();

  const menuBtn = e.target.closest('#burger');
  if (menuBtn) return setMenu(!document.body.classList.contains('menu-open'));

  const action = e.target.closest('[data-filter],[data-var],[data-fr],[data-mix],[data-fam],[data-scroll]');
  if (!action) return;

  if (action.dataset.filter) {
    const c = action.dataset.filter;
    $('#grid').innerHTML = (c === 'tutti' ? PRODUCTS : PRODUCTS.filter(p => p.cat === c)).map(card).join('');
    document.querySelectorAll('#filters .chip').forEach(x => x.classList.toggle('on', x === action));
    try {
      history.replaceState(null, '', '#/shop/' + c);
    } catch (_) {}
  } else if (action.dataset.var !== undefined || action.dataset.fr || action.dataset.mix) {
    const p = P[location.hash.split('/')[2]];
    if (action.dataset.var !== undefined) sel.v = +action.dataset.var;
    else if (action.dataset.mix) {
      sel.mix = +action.dataset.mix;
      sel.f = null;
      sel.frags = [];
    } else if (sel.mix) {
      const fragranceId = action.dataset.fr;
      const selectedIndex = sel.frags.indexOf(fragranceId);
      if (selectedIndex >= 0) {
        sel.frags.splice(selectedIndex, 1);
      } else if (sel.frags.length < sel.mix) {
        sel.frags.push(fragranceId);
      }
    } else {
      sel.f = action.dataset.fr;
      sel.frags = [];
      sel.mix = null;
    }
    $('#buy').innerHTML = Buy(p);
  } else if (action.dataset.fam) {
    document.querySelectorAll('#fams .chip').forEach(x => x.classList.toggle('on', x === action));
    famShow(action.dataset.fam);
  } else if (action.dataset.scroll) {
    e.preventDefault();
    const el = document.getElementById(action.dataset.scroll);
    if (el) {
      const smooth = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
      el.scrollIntoView({ behavior: smooth });
    }
  }
});

document.addEventListener('click', e => {
  if (e.target.closest('#mnav a')) setMenu(false);
});

/* =====================================================================
   MODULO CONTATTI E INVIO WHATSAPP
   ===================================================================== */
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]');
  if (!f) return;

  e.preventDefault();

  const d = Object.fromEntries(new FormData(f));
  const text = f.dataset.form === 'quote'
    ? `Ciao! Vorrei un preventivo per delle bomboniere.\nNome: ${d.name}\nOccasione: ${d.occ}\nData: ${d.date || 'da definire'}\nQuantità: ${d.qty || 'da definire'}\nNote: ${d.note || '-'}`
    : `Ciao! Sono ${d.name}.\nMi serve aiuto per: ${d.topic}\n${d.note}`;

  window.open(wa(text), '_blank');
  f.querySelector('.fout').innerHTML = `Grazie! Se WhatsApp non si è aperto, <a href="${wa(text)}" target="_blank" rel="noopener">tocca qui per inviare il messaggio</a>.`;
});

window.addEventListener('hashchange', router);
buildChrome();
applyTheme(document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light');
router();
updateCountdowns();
setInterval(updateCountdowns, 1000);
</script>
</body>
</html>
